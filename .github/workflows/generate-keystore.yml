name: Generate Keystore (Run Once)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias'
        required: true
        default: 'purgeit-key'
      organization:
        description: 'Your name or organisation'
        required: true
        default: 'PurgeIt'
      country_code:
        description: 'Two-letter country code'
        required: true
        default: 'PK'
      validity_years:
        description: 'Key validity in years'
        required: true
        default: '25'

jobs:
  generate:
    name: Generate Release Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate random passwords
        id: passwords
        run: |
          STORE_PASS=$(openssl rand -hex 16)
          KEY_PASS=$(openssl rand -hex 16)
          echo "store_pass=$STORE_PASS" >> $GITHUB_OUTPUT
          echo "key_pass=$KEY_PASS" >> $GITHUB_OUTPUT

      - name: Generate keystore
        run: |
          DAYS=$(( ${{ github.event.inputs.validity_years }} * 365 ))
          keytool -genkeypair \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity $DAYS \
            -keystore purgeit-release.jks \
            -storepass "${{ steps.passwords.outputs.store_pass }}" \
            -keypass "${{ steps.passwords.outputs.key_pass }}" \
            -dname "CN=${{ github.event.inputs.organization }}, O=${{ github.event.inputs.organization }}, C=${{ github.event.inputs.country_code }}" \
            -noprompt

      - name: Encode keystore to base64
        id: encode
        run: echo "b64=$(base64 -w 0 purgeit-release.jks)" >> $GITHUB_OUTPUT

      - name: Write instructions file
        run: |
          echo "PURGEIT GitHub Secrets Setup" > KEYSTORE_SECRETS_SETUP.txt
          echo "=============================" >> KEYSTORE_SECRETS_SETUP.txt
          echo "" >> KEYSTORE_SECRETS_SETUP.txt
          echo "Add these secrets in: GitHub repo > Settings > Secrets > Actions" >> KEYSTORE_SECRETS_SETUP.txt
          echo "" >> KEYSTORE_SECRETS_SETUP.txt
          echo "KEYSTORE_BASE64  = (contents of keystore-b64.txt)" >> KEYSTORE_SECRETS_SETUP.txt
          echo "STORE_PASSWORD   = ${{ steps.passwords.outputs.store_pass }}" >> KEYSTORE_SECRETS_SETUP.txt
          echo "KEY_ALIAS        = ${{ github.event.inputs.key_alias }}" >> KEYSTORE_SECRETS_SETUP.txt
          echo "KEY_PASSWORD     = ${{ steps.passwords.outputs.key_pass }}" >> KEYSTORE_SECRETS_SETUP.txt
          echo "REVENUECAT_API_KEY = (from RevenueCat dashboard)" >> KEYSTORE_SECRETS_SETUP.txt
          echo "GOOGLE_SERVICES_JSON = (full contents of google-services.json from Firebase)" >> KEYSTORE_SECRETS_SETUP.txt
          echo "" >> KEYSTORE_SECRETS_SETUP.txt
          echo "Save passwords in a password manager - you cannot recover them." >> KEYSTORE_SECRETS_SETUP.txt
          echo "${{ steps.encode.outputs.b64 }}" > keystore-b64.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keystore-setup-instructions
          path: |
            KEYSTORE_SECRETS_SETUP.txt
            keystore-b64.txt
          retention-days: 1

      - name: Delete keystore from runner
        if: always()
        run: rm -f purgeit-release.jks

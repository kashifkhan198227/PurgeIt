name: Generate Keystore (Run Once)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias (e.g. purgeit-key)'
        required: true
        default: 'purgeit-key'
      organization:
        description: 'Your name or organisation'
        required: true
        default: 'PurgeIt'
      country_code:
        description: 'Two-letter country code (e.g. PK, US, GB)'
        required: true
        default: 'PK'
      validity_years:
        description: 'Key validity in years (25 recommended)'
        required: true
        default: '25'

jobs:
  generate:
    name: Generate Release Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate random passwords
        id: passwords
        run: |
          STORE_PASS=$(openssl rand -base64 20 | tr -dc 'A-Za-z0-9' | head -c 20)
          KEY_PASS=$(openssl rand -base64 20 | tr -dc 'A-Za-z0-9' | head -c 20)
          echo "store_pass=$STORE_PASS" >> $GITHUB_OUTPUT
          echo "key_pass=$KEY_PASS" >> $GITHUB_OUTPUT

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity $(( ${{ github.event.inputs.validity_years }} * 365 )) \
            -keystore purgeit-release.jks \
            -storepass "${{ steps.passwords.outputs.store_pass }}" \
            -keypass "${{ steps.passwords.outputs.key_pass }}" \
            -dname "CN=${{ github.event.inputs.organization }}, O=${{ github.event.inputs.organization }}, C=${{ github.event.inputs.country_code }}" \
            -noprompt
          echo "Keystore generated"

      - name: Encode keystore to base64
        id: encode
        run: |
          B64=$(base64 -w 0 purgeit-release.jks)
          echo "b64_keystore=$B64" >> $GITHUB_OUTPUT

      - name: Write setup instructions
        run: |
          STORE_PASS="${{ steps.passwords.outputs.store_pass }}"
          KEY_PASS="${{ steps.passwords.outputs.key_pass }}"
          KEY_ALIAS="${{ github.event.inputs.key_alias }}"
          B64="${{ steps.encode.outputs.b64_keystore }}"

          cat > KEYSTORE_SECRETS_SETUP.txt << EOF
          PURGEIT - GitHub Secrets Setup
          ================================

          Go to: GitHub repo > Settings > Secrets and variables > Actions > New repository secret

          Add these 5 secrets:

          1. KEYSTORE_BASE64   = (contents of keystore-b64.txt)
          2. STORE_PASSWORD    = $STORE_PASS
          3. KEY_ALIAS         = $KEY_ALIAS
          4. KEY_PASSWORD      = $KEY_PASS
          5. REVENUECAT_API_KEY = (from RevenueCat dashboard)

          IMPORTANT: Also add GOOGLE_SERVICES_JSON secret with the full contents
          of your google-services.json from Firebase Console.

          Save passwords in a password manager - losing them means you cannot
          re-sign future updates and Google Play will reject them.
          EOF

          echo "$B64" > keystore-b64.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keystore-setup-instructions
          path: |
            KEYSTORE_SECRETS_SETUP.txt
            keystore-b64.txt
          retention-days: 1

      - name: Delete keystore from runner
        if: always()
        run: rm -f purgeit-release.jks

      - name: Summary
        run: |
          echo "## Keystore generated!" >> $GITHUB_STEP_SUMMARY
          echo "Download the keystore-setup-instructions artifact and add the secrets to your repo." >> $GITHUB_STEP_SUMMARY

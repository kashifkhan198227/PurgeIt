name: Generate Keystore (Run Once)

# ─────────────────────────────────────────────────────────────────────────────
# Run this workflow ONCE to generate your release keystore in the cloud.
# You never need Java or Android Studio on your local machine.
#
# After it finishes:
#   1. Go to the Actions run → download the "keystore-setup-instructions" artifact
#   2. Follow the instructions inside to add the 4 GitHub Secrets
#   3. Delete or disable this workflow — it is only needed once
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias (e.g. purgeit-key)'
        required: true
        default: 'purgeit-key'
      organization:
        description: 'Your name or organisation'
        required: true
        default: 'PurgeIt'
      country_code:
        description: 'Two-letter country code (e.g. PK, US, GB)'
        required: true
        default: 'PK'
      validity_years:
        description: 'Key validity in years (25 recommended)'
        required: true
        default: '25'

jobs:
  generate:
    name: Generate Release Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate random passwords
        id: passwords
        run: |
          STORE_PASS=$(openssl rand -base64 20 | tr -dc 'A-Za-z0-9!@#$%' | head -c 20)
          KEY_PASS=$(openssl rand -base64 20 | tr -dc 'A-Za-z0-9!@#$%' | head -c 20)
          echo "store_pass=$STORE_PASS" >> $GITHUB_OUTPUT
          echo "key_pass=$KEY_PASS" >> $GITHUB_OUTPUT

      - name: Generate keystore with keytool
        run: |
          keytool -genkeypair \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity $(( ${{ github.event.inputs.validity_years }} * 365 )) \
            -keystore purgeit-release.jks \
            -storepass "${{ steps.passwords.outputs.store_pass }}" \
            -keypass "${{ steps.passwords.outputs.key_pass }}" \
            -dname "CN=${{ github.event.inputs.organization }}, O=${{ github.event.inputs.organization }}, C=${{ github.event.inputs.country_code }}" \
            -noprompt
          echo "Keystore generated successfully"

      - name: Encode keystore to base64
        id: encode
        run: |
          B64=$(base64 -w 0 purgeit-release.jks)
          echo "b64_keystore=$B64" >> $GITHUB_OUTPUT

      - name: Write setup instructions
        run: |
          cat > KEYSTORE_SECRETS_SETUP.txt << 'INSTRUCTIONS'
          ╔══════════════════════════════════════════════════════════════════════╗
          ║           PURGEIT — GitHub Secrets Setup (copy these)              ║
          ╚══════════════════════════════════════════════════════════════════════╝

          Go to your GitHub repo → Settings → Secrets and variables → Actions
          → New repository secret  and add these 5 secrets EXACTLY:

          ┌──────────────────────┬─────────────────────────────────────────────┐
          │ Secret Name          │ Value                                       │
          ├──────────────────────┼─────────────────────────────────────────────┤
          INSTRUCTIONS

          echo "  │ KEYSTORE_BASE64      │ (see keystore-b64.txt)              │" >> KEYSTORE_SECRETS_SETUP.txt
          echo "  │ STORE_PASSWORD       │ ${{ steps.passwords.outputs.store_pass }} │" >> KEYSTORE_SECRETS_SETUP.txt
          echo "  │ KEY_ALIAS            │ ${{ github.event.inputs.key_alias }} │" >> KEYSTORE_SECRETS_SETUP.txt
          echo "  │ KEY_PASSWORD         │ ${{ steps.passwords.outputs.key_pass }} │" >> KEYSTORE_SECRETS_SETUP.txt
          echo "  │ REVENUECAT_API_KEY   │ (from RevenueCat dashboard)         │" >> KEYSTORE_SECRETS_SETUP.txt

          cat >> KEYSTORE_SECRETS_SETUP.txt << 'FOOTER'
          └──────────────────────┴─────────────────────────────────────────────┘

          IMPORTANT — Save these passwords in a password manager.
          If you lose them you cannot re-sign future updates with the same key,
          and Google Play will reject the update.

          After adding secrets:
            1. Add google-services.json to app/ (from Firebase Console)
            2. Push your code to GitHub
            3. The "Build & Release AAB" workflow runs automatically
            4. Download the AAB from the Actions artifacts
            5. Upload the AAB to Google Play Console

          FOOTER

          echo "${{ steps.encode.outputs.b64_keystore }}" > keystore-b64.txt

      - name: Upload instructions + b64 keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore-setup-instructions
          path: |
            KEYSTORE_SECRETS_SETUP.txt
            keystore-b64.txt
          retention-days: 1

      - name: Delete keystore from runner
        if: always()
        run: rm -f purgeit-release.jks

      - name: Summary
        run: |
          echo "## Keystore generated!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the **keystore-setup-instructions** artifact from this run." >> $GITHUB_STEP_SUMMARY
          echo "It contains your 5 GitHub Secret values. Add them, then push code to trigger the build." >> $GITHUB_STEP_SUMMARY
